<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Boca Juniors - El Único Grande</title>
</head>
<body>
    <header>
        <section class="contenedor-carrusel">
            <div class="carrusel-track" id="track">
                <article class="diapositiva">
                    <!--PARTE SUPERIOR: VIDEO/FOTO-->
                    <div class="area-visual">
                        <video autoplay loop muted playsinline class="video-pantalla">
                            <source src="carrusel/13b.mp4" type="video/mp4">
                        </video>
                    </div>
                    <!--PARTE INFERIOR: INFO Y TITULO-->
                    <div class="franja-informativa">
                        <div class="contenedor-titulo">
                            <h1 class="texto-principal">EL ÚNICO GRANDE</h1>
                            <h2 class="subtitulo-azul">cabj</h2>
                        </div>

                        <div class="descripcion-noticia">
                            <p></p>
                        </div>
                        <div class="boton-leer">
                            <a href="#" class="link-subrayado">Leer más</a>
                        </div>
                    </div>
                </article>

                <article class="diapositiva">
                <div class="area-visual">
                    <img src="carrusel/kHRvqBsd8iHs.png" class="video-pantalla" alt="Boca en cuartos">
                </div>

                    <!-- Parte Inferior: Información -->
                    <div class="franja-informativa">
                        <div class="contenedor-titulo">
                            <h1 class="texto-principal">A CUARTOS DE FINAL</h1>
                            <h2 class="subtitulo-azul"></h2>
                        </div>

                        <div class="descripcion-noticia">
                            <p>Boca eliminó a San Martín en Corrientes y ya está entre los ocho mejores de la Liga Nacional.</p>
                        </div>
                        <div class="boton-leer">
                            <a href="#" class="link-subrayado">Leer más</a>
                        </div>
                    </div>
                
                </article>
            </div>
        </section>
    </header>
    <script src="script.js"></script>
</body>
</html>
